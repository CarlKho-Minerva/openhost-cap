name: Build MinIO

# Publishes ghcr.io/<owner>/minio:<release> from source (see minio/Dockerfile).
# Run by hand when the pinned release changes, then pin the printed digest in
# the main Dockerfile.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: minio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/minio:RELEASE.2025-09-07T16-13-09Z
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Digest to pin
        run: echo "ghcr.io/${{ github.repository_owner }}/minio@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Binary runs and reports the expected release
        run: |
          docker run --rm --platform linux/amd64 --entrypoint /usr/bin/minio \
            "ghcr.io/${{ github.repository_owner }}/minio@${{ steps.build.outputs.digest }}" --version \
            | tee /dev/stderr | grep -q 'RELEASE.2025-09-07T16-13-09Z.*07c3a429bfed433e49018cb0f78a52145d4bedeb'
